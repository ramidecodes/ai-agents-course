<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Agents Fundamentals: Slides</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9.144,500;0,9.144,600;0,9.144,700;1,9.144,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #111111;
        --ink-soft: #444444;
        --ink-faint: #777777;
        --paper: #fef9ee;
        --rule: rgba(0, 0, 0, 0.12);
        --rule-strong: rgba(0, 0, 0, 0.22);
        --wash: #f7f7f7;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }

      *,
      *:before,
      *:after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        font-family: "Figtree", system-ui, sans-serif;
        font-size: 1.0625rem;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 3px;
      }

      .deck {
        position: relative;
        width: 100%;
        height: 100%;
      }

      .slide {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: clamp(2rem, 5vw, 4rem) clamp(2rem, 6vw, 5rem);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.35s var(--ease),
          visibility 0.35s;
      }

      .slide.is-active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      @media (prefers-reduced-motion: reduce) {
        .slide {
          transition: none;
        }
      }

      .slide-header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 1rem;
        padding-bottom: 1.25rem;
        border-bottom: 1px solid var(--rule);
        min-height: 2.5rem;
      }

      .slide-kicker {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin: 0;
      }

      .slide-module {
        font-size: 0.8125rem;
        color: var(--ink-soft);
        margin: 0;
        text-align: right;
        max-width: 28ch;
      }

      .slide-body-wrap {
        display: flex;
        align-items: center;
        min-height: 0;
        padding: clamp(1.5rem, 4vh, 3rem) 0;
      }

      .slide-inner {
        width: 100%;
        max-width: 72rem;
        margin-inline: auto;
      }

      /* —— Title slide —— */
      .slide--title .slide-body-wrap {
        align-items: start;
      }

      .slide--title .slide-inner {
        display: grid;
        grid-template-columns: 1fr;
        gap: clamp(2rem, 4vw, 3rem);
        align-items: start;
        text-align: left;
      }

      @media (min-width: 900px) {
        .slide--title .slide-inner {
          grid-template-columns: minmax(0, 1.05fr) minmax(16rem, 34rem);
          align-items: center;
        }
      }

      .slide--title .title-copy {
        min-width: 0;
      }

      .slide--title .title-visual {
        min-width: 0;
      }

      .slide--title .title-visual .slide-visual {
        margin: 0;
      }

      .slide--title .title-visual .img-placeholder {
        aspect-ratio: 1672 / 941;
        min-height: 14rem;
      }

      .slide--title h1 {
        font-family: "Fraunces", Georgia, serif;
        font-optical-sizing: auto;
        font-weight: 600;
        font-size: clamp(2.75rem, 7vw, 5rem);
        line-height: 1.05;
        letter-spacing: -0.03em;
        margin: 0 0 1.25rem;
        max-width: 12ch;
      }

      .slide--title .subtitle {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 500;
        font-style: italic;
        font-size: clamp(1.2rem, 2.4vw, 1.65rem);
        line-height: 1.35;
        color: var(--ink-soft);
        margin: 0 0 2.5rem;
        max-width: 32ch;
      }

      .slide--title .meta {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: 0.35rem 1.75rem;
        font-size: 0.9375rem;
        color: var(--ink-faint);
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .slide--title .meta li {
        position: relative;
      }

      .slide--title .meta li + li:before {
        content: "";
        position: absolute;
        left: -0.95rem;
        top: 0.55em;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: var(--ink-faint);
      }

      /* —— Lesson divider —— */
      .slide--lesson .slide-body-wrap {
        align-items: center;
      }

      .slide--lesson .lesson-num {
        font-family: "Fraunces", Georgia, serif;
        font-size: clamp(4rem, 12vw, 8rem);
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--ink);
        margin: 0 0 0.5rem;
      }

      .slide--lesson h2 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: clamp(1.75rem, 4vw, 2.75rem);
        line-height: 1.15;
        letter-spacing: -0.02em;
        margin: 0 0 1.5rem;
        max-width: 22ch;
      }

      .slide--lesson .lesson-runtime {
        font-size: 0.9375rem;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin: 0;
      }

      /* —— Content slide —— */
      .slide--content .content-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: clamp(1.5rem, 4vw, 3rem);
        align-items: start;
      }

      @media (min-width: 900px) {
        .slide--content .content-grid.has-aside {
          grid-template-columns: 1fr minmax(16rem, 34rem);
        }
      }

      .slide--content .content-main {
        min-width: 0;
      }

      .slide--content .content-aside {
        display: flex;
        flex-direction: column;
        gap: clamp(1rem, 2.5vw, 1.5rem);
        min-width: 0;
      }

      .slide--content .content-aside .slide-visual {
        flex: 0 0 auto;
      }

      .slide--content .content-aside .sidebar {
        flex: 0 1 auto;
      }

      .slide--content h2 {
        font-family: "Fraunces", Georgia, serif;
        font-weight: 600;
        font-size: clamp(1.75rem, 3.5vw, 2.5rem);
        line-height: 1.12;
        letter-spacing: -0.02em;
        margin: 0 0 1.25rem;
        max-width: 20ch;
      }

      .slide--content ul.bullets {
        margin: 0;
        padding: 0 0 0 1.25rem;
        font-size: clamp(1.05rem, 2vw, 1.35rem);
        line-height: 1.5;
        color: var(--ink-soft);
      }

      .slide--content ul.bullets li {
        margin-bottom: 0.65em;
      }

      .slide--content ul.bullets li:last-child {
        margin-bottom: 0;
      }

      .slide--content code {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.88em;
        background: var(--wash);
        padding: 0.1em 0.35em;
        border: 1px solid var(--rule);
      }

      .terminal-block {
        margin-top: 1.25rem;
        border: 1px solid var(--rule-strong);
        background: var(--wash);
        overflow: hidden;
      }

      .terminal-block + .terminal-block {
        margin-top: 0.5rem;
      }

      .terminal-label {
        display: block;
        padding: 0.4rem 0.75rem;
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-faint);
        border-bottom: 1px solid var(--rule);
        background: var(--paper);
      }

      .terminal-block pre {
        margin: 0;
        padding: 0.85rem 1rem;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: clamp(0.8125rem, 1.6vw, 0.9375rem);
        line-height: 1.55;
        color: var(--ink);
        white-space: pre-wrap;
        word-break: break-word;
      }

      .terminal-block code {
        font-family: inherit;
        font-size: inherit;
        background: none;
        padding: 0;
        border: none;
      }

      .slide-urls {
        margin-top: 1rem;
        padding: 0;
        list-style: none;
        font-size: 0.875rem;
        line-height: 1.5;
        color: var(--ink-soft);
      }

      .slide-urls li + li {
        margin-top: 0.35rem;
      }

      .slide-urls a {
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        font-size: 0.92em;
        color: var(--ink);
        text-decoration: underline;
        text-decoration-color: var(--rule-strong);
        text-underline-offset: 0.15em;
      }

      .slide-urls a:hover {
        text-decoration-color: var(--ink);
      }

      /* —— On-slide learner tasks —— */
      .slide-tasks {
        margin-top: 1.5rem;
        padding: 1rem 1.15rem;
        border: 1px solid var(--rule-strong);
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.025) 0%,
          transparent 100%
        );
      }

      .slide-tasks-label {
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink);
        margin: 0 0 0.75rem;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .slide-tasks-label:before {
        content: "";
        display: inline-block;
        width: 0.55rem;
        height: 0.55rem;
        border: 1.5px solid var(--ink);
        flex-shrink: 0;
      }

      .slide-tasks-list {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: clamp(0.9375rem, 1.8vw, 1.125rem);
        line-height: 1.45;
        color: var(--ink-soft);
      }

      .slide-tasks-list li + li {
        margin-top: 0.55rem;
        padding-top: 0.55rem;
        border-top: 1px solid var(--rule);
      }

      .slide-task {
        display: flex;
        align-items: flex-start;
        gap: 0.65rem;
        cursor: pointer;
      }

      .slide-task input[type="checkbox"] {
        flex-shrink: 0;
        width: 1.05rem;
        height: 1.05rem;
        margin: 0.15em 0 0;
        accent-color: var(--ink);
        cursor: pointer;
      }

      .slide-task-text {
        flex: 1;
        min-width: 0;
      }

      .slide-task:has(input:checked) .slide-task-text {
        color: var(--ink-faint);
        text-decoration: line-through;
        text-decoration-color: var(--rule-strong);
      }

      /* —— Slide visuals —— */
      .slide-visual {
        margin: 0;
        display: block;
        line-height: 0;
        aspect-ratio: 1672 / 941;
        max-width: 100%;
      }

      .slide-visual img {
        display: block;
        width: 100%;
        height: 100%;
        max-width: 100%;
        object-fit: contain;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* —— Image placeholder (slides awaiting assets) —— */
      .img-placeholder {
        border: 1px solid var(--rule-strong);
        background: var(--wash);
        aspect-ratio: 4 / 3;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 1.25rem;
        min-height: 10rem;
      }

      .img-placeholder-label {
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin: 0 0 0.5rem;
      }

      .img-placeholder-name {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.75rem;
        color: var(--ink);
        margin: 0 0 0.75rem;
        word-break: break-all;
        max-width: 100%;
      }

      .img-placeholder-desc {
        font-size: 0.8125rem;
        line-height: 1.45;
        color: var(--ink-soft);
        margin: 0;
        max-width: 28ch;
      }

      /* —— Sidebar glossary —— */
      .sidebar {
        border-left: 1px solid var(--rule);
        padding-left: 1.25rem;
      }

      @media (max-width: 899px) {
        .sidebar {
          border-left: none;
          border-top: 1px solid var(--rule);
          padding-left: 0;
          padding-top: 1.25rem;
        }
      }

      @media (min-width: 900px) {
        .content-aside .sidebar {
          border-left: none;
          padding-left: 0;
          border-top: 1px solid var(--rule);
          padding-top: 1.25rem;
        }

        .slide--content
          .content-grid.has-aside:not(:has(.slide-visual))
          .sidebar {
          border-top: none;
          padding-top: 0;
          border-left: 1px solid var(--rule);
          padding-left: 1.25rem;
        }
      }

      .sidebar-label {
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--ink-faint);
        margin: 0 0 0.75rem;
      }

      .sidebar ul {
        margin: 0;
        padding: 0;
        list-style: none;
        font-size: 0.875rem;
        line-height: 1.45;
        color: var(--ink-soft);
      }

      .sidebar li + li {
        margin-top: 0.75rem;
        padding-top: 0.75rem;
        border-top: 1px solid var(--rule);
      }

      .sidebar strong {
        display: block;
        color: var(--ink);
        font-weight: 600;
        margin-bottom: 0.15rem;
      }

      /* —— Presenter notes —— */
      .presenter-notes {
        position: fixed;
        bottom: 4.5rem;
        left: 50%;
        transform: translateX(-50%);
        width: min(42rem, calc(100% - 2rem));
        max-height: 30vh;
        overflow-y: auto;
        background: var(--ink);
        color: var(--paper);
        padding: 1rem 1.25rem;
        font-size: 0.875rem;
        line-height: 1.5;
        border-radius: 2px;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transition:
          opacity 0.25s var(--ease),
          visibility 0.25s;
        z-index: 20;
      }

      .presenter-notes.is-visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .presenter-notes-label {
        font-size: 0.6875rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.6;
        margin: 0 0 0.5rem;
      }

      .presenter-notes p {
        margin: 0;
      }

      /* —— Chrome / controls —— */
      .chrome {
        position: fixed;
        inset-inline: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.75rem clamp(1rem, 3vw, 2rem);
        background: linear-gradient(to top, var(--paper) 60%, transparent);
        z-index: 10;
        pointer-events: none;
      }

      .chrome > * {
        pointer-events: auto;
      }

      .counter {
        font-size: 0.8125rem;
        font-variant-numeric: tabular-nums;
        color: var(--ink-faint);
        min-width: 5rem;
      }

      .nav-controls {
        display: flex;
        gap: 0.5rem;
      }

      .nav-btn {
        appearance: none;
        border: 1px solid var(--rule-strong);
        background: var(--paper);
        color: var(--ink);
        width: 2.5rem;
        height: 2.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition:
          background 0.2s var(--ease),
          border-color 0.2s;
      }

      .nav-btn:hover:not(:disabled) {
        background: var(--wash);
        border-color: var(--ink);
      }

      .nav-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }

      .nav-btn svg {
        width: 1rem;
        height: 1rem;
      }

      .hints {
        font-size: 0.6875rem;
        color: var(--ink-faint);
        text-align: right;
        min-width: 5rem;
      }
    </style>
  </head>
  <body>
    <div class="deck" id="deck" aria-live="polite"></div>

    <div class="presenter-notes" id="notes" hidden>
      <p class="presenter-notes-label">Presenter note</p>
      <p id="notes-text"></p>
    </div>

    <div class="chrome">
      <span class="counter" id="counter">1 / 69</span>
      <div class="nav-controls">
        <button
          type="button"
          class="nav-btn"
          id="prev"
          aria-label="Previous slide"
        >
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="M10 3 L5 8 L10 13" />
          </svg>
        </button>
        <button type="button" class="nav-btn" id="next" aria-label="Next slide">
          <svg
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            aria-hidden="true"
          >
            <path d="M6 3 L11 8 L6 13" />
          </svg>
        </button>
      </div>
      <span class="hints" id="hints">← → · N notes</span>
    </div>

            file: "l16-value-of-the-loop.png",
            desc: "16-bit pixel art: shiny first-draft pile smaller than a controlled loop pathway with gates; tiny handoff card labeled Course 2 at the end.",
          },
        },

        /* —— Lesson 17 —— */
        {
          type: "lesson",
          lesson: 17,
          module: "Module 07 · Your first supervised workflow",
          title: "Why this single-user setup stops at one person",
          runtime: "2 min",
        },
        {
          type: "content",
          fullCourse: false,
          lesson: 17,
          module: "Module 07 · Your first supervised workflow",
          title: "What you have now",
          bullets: [
            "One agent, one local folder, one supervised loop",
            "Complete for one person",
          ],
          image: {
            file: "l17-what-you-have-now.png",
            desc: "16-bit pixel art: a single human sprite standing inside a cozy, complete workshop room: desk, folder, assistant robot, with a solid checkmark on the door.",
          },
        },
        {
          type: "content",
          lesson: 17,
          module: "Module 07 · Your first supervised workflow",
          title: "Add a second person",
          bullets: [
            "Whose folder is current? Whose memory is right?",
            "Not solved by copying files back and forth",
          ],
          image: {
            file: "l17-add-a-second-person.png",
            desc: "16-bit pixel art: two identical workshop rooms side by side, each with its own folder and assistant; a confused double-arrow between them shows conflicting copies.",
          },
        },
        {
          type: "content",
          lesson: 17,
          module: "Module 07 · Your first supervised workflow",
          title: "A different problem, later",
          bullets: [
            "Access control, conflict resolution, shared memory",
            "Next: AI Agents for Your Business",
          ],
          image: {
            file: "l17-a-different-problem-later.png",
            desc: '16-bit pixel art: the two workshop rooms connected by a bridge under construction, with a signpost reading "Course 2" pointing across it.',
          },
          notes:
            "No screen-share required. Close on the final two-room/bridge visual and state the single-user boundary plainly, without turning the ending into a sales pitch for Course 2.",
        },
      ];

      const deckOptions = new URLSearchParams(window.location.search);
      const showLessonDividers = deckOptions.has("lesson-dividers");
      const showOptionalSlides = deckOptions.has("extended");
      const ACTIVE_SLIDES = SLIDES.filter(
        (slide) =>
          (showLessonDividers || slide.type !== "lesson") &&
          (showOptionalSlides || slide.fullCourse !== false),
      );

      const deck = document.getElementById("deck");
      const counter = document.getElementById("counter");
      const prevBtn = document.getElementById("prev");
      const nextBtn = document.getElementById("next");
      const notesEl = document.getElementById("notes");
      const notesText = document.getElementById("notes-text");

      let current = 0;
      let notesVisible = false;

      function escapeHtml(str) {
        return str
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function renderBullets(bullets) {
        return `<ul class="bullets">${bullets.map((b) => `<li>${b}</li>`).join("")}</ul>`;
      }

      function imageAltText(img, title) {
        if (img.desc) {
          return img.desc.replace(/^16-bit pixel art:\s*/i, "");
        }
        return title;
      }

      function renderImage(img, title) {
        if (!img) return "";
        const src = PIXEL_ART_BY_TITLE[title];
        if (src) {
          const alt = imageAltText(img, title);
          return `
        <figure class="slide-visual">
          <img src="${escapeHtml(src)}" alt="${escapeHtml(alt)}" width="1672" height="941" loading="lazy" decoding="async" />
        </figure>`;
        }
        return `
        <div class="img-placeholder" role="img" aria-label="Image placeholder: ${escapeHtml(img.file)}">
          <p class="img-placeholder-label">Image asset</p>
          <p class="img-placeholder-name">${escapeHtml(img.file)}</p>
          <p class="img-placeholder-desc">${escapeHtml(img.desc)}</p>
        </div>`;
      }

      function renderTerminal(terminal) {
        if (!terminal || !terminal.lines || !terminal.lines.length) return "";
        const label = terminal.label
          ? `<span class="terminal-label">${escapeHtml(terminal.label)}</span>`
          : "";
        const body = terminal.lines.map((line) => escapeHtml(line)).join("\n");
        return `
        <div class="terminal-block">
          ${label}
          <pre><code>${body}</code></pre>
        </div>`;
      }

      function renderTerminals(data) {
        const blocks = [];
        if (data.terminal) blocks.push(data.terminal);
        if (data.terminals) blocks.push(...data.terminals);
        return blocks.map((t) => renderTerminal(t)).join("");
      }

      function renderUrls(urls) {
        if (!urls || !urls.length) return "";
        return `<ul class="slide-urls">${urls.map((u) => `<li><a href="${escapeHtml(u.href)}" target="_blank" rel="noopener noreferrer">${escapeHtml(u.label || u.href)}</a></li>`).join("")}</ul>`;
      }

      function renderSidebar(items) {
        if (!items || !items.length) return "";
        return `
        <aside class="sidebar">
          <p class="sidebar-label">Glossary</p>
          <ul>${items.map((i) => `<li><strong>${escapeHtml(i.term)}</strong>${escapeHtml(i.def)}</li>`).join("")}</ul>
        </aside>`;
      }

      function renderTasks(data) {
        if (!data.tasks || !data.tasks.length) return "";
        const label = data.tasksLabel || "Your tasks";
        const items = data.tasks
          .map(
            (task) =>
              `<li><label class="slide-task"><input type="checkbox" /><span class="slide-task-text">${escapeHtml(task)}</span></label></li>`,
          )
          .join("");
        return `
        <div class="slide-tasks">
          <p class="slide-tasks-label">${escapeHtml(label)}</p>
          <ul class="slide-tasks-list">${items}</ul>
        </div>`;
      }

      function renderContentAside(data) {
        const hasVisual = Boolean(data.image);
        const hasSidebar = Boolean(data.sidebar && data.sidebar.length);
        if (!hasVisual && !hasSidebar) return "";

        return `
        <div class="content-aside">
          ${hasVisual ? renderImage(data.image, data.title) : ""}
          ${renderSidebar(data.sidebar)}
        </div>`;
      }

      function renderSlide(data, index) {
        const active = index === current ? " is-active" : "";
        let inner = "";

        if (data.type === "title") {
          const visual = data.image
            ? `<div class="title-visual">${renderImage(data.image, data.title)}</div>`
            : "";
          inner = `
          <div class="slide-inner">
            <div class="title-copy">
              <h1>${escapeHtml(data.title)}</h1>
              <p class="subtitle">${escapeHtml(data.subtitle)}</p>
              <ul class="meta">${data.meta.map((m) => `<li>${escapeHtml(m)}</li>`).join("")}</ul>
            </div>
            ${visual}
          </div>`;
          return `<section class="slide slide--title${active}" data-index="${index}" aria-hidden="${index !== current}"><div class="slide-header"><p class="slide-kicker">${escapeHtml(data.kicker)}</p></div><div class="slide-body-wrap">${inner}</div><div></div></section>`;
        }

        if (data.type === "lesson") {
          inner = `
          <div class="slide-inner">
            <p class="lesson-num">${String(data.lesson).padStart(2, "0")}</p>
            <h2>${escapeHtml(data.title)}</h2>
            <p class="lesson-runtime">${escapeHtml(data.runtime)}</p>
          </div>`;
          return `<section class="slide slide--lesson${active}" data-index="${index}" aria-hidden="${index !== current}"><div class="slide-header"><p class="slide-kicker">Lesson ${data.lesson}</p><p class="slide-module">${escapeHtml(data.module)}</p></div><div class="slide-body-wrap">${inner}</div><div></div></section>`;
        }

        const hasAside =
          Boolean(data.image) || Boolean(data.sidebar && data.sidebar.length);
        const gridClass = ["content-grid", hasAside ? "has-aside" : ""]
          .filter(Boolean)
          .join(" ");

        inner = `
        <div class="slide-inner">
          <div class="${gridClass}">
            <div class="content-main">
              <h2>${escapeHtml(data.title)}</h2>
              ${renderBullets(data.bullets)}
              ${renderTerminals(data)}
              ${renderUrls(data.urls)}
              ${renderTasks(data)}
            </div>
            ${renderContentAside(data)}
          </div>
        </div>`;

        return `<section class="slide slide--content${active}" data-index="${index}" data-notes="${data.notes ? escapeHtml(data.notes) : ""}" aria-hidden="${index !== current}"><div class="slide-header"><p class="slide-kicker">Lesson ${data.lesson}</p><p class="slide-module">${escapeHtml(data.module)}</p></div><div class="slide-body-wrap">${inner}</div><div></div></section>`;
      }

      function buildDeck() {
        deck.innerHTML = ACTIVE_SLIDES.map((s, i) => renderSlide(s, i)).join(
          "",
        );
      }

      function updateUI() {
        deck.querySelectorAll(".slide").forEach((el, i) => {
          const active = i === current;
          el.classList.toggle("is-active", active);
          el.setAttribute("aria-hidden", String(!active));
        });

        counter.textContent = `${current + 1} / ${ACTIVE_SLIDES.length}`;
        prevBtn.disabled = current === 0;
        nextBtn.disabled = current === ACTIVE_SLIDES.length - 1;

        const slide = ACTIVE_SLIDES[current];
        const note =
          slide.notes ||
          (slide.type === "content"
            ? deck.querySelector(`.slide[data-index="${current}"]`)?.dataset
                .notes
            : "");
        if (note) {
          notesText.textContent = note;
          notesEl.hidden = false;
        } else {
          notesText.textContent = "";
          notesEl.hidden = true;
          notesVisible = false;
          notesEl.classList.remove("is-visible");
        }
      }

      function goTo(index) {
        current = Math.max(0, Math.min(ACTIVE_SLIDES.length - 1, index));
        updateUI();
      }

      function next() {
        goTo(current + 1);
      }
      function prev() {
        goTo(current - 1);
      }

      function toggleNotes() {
        if (!notesText.textContent) return;
        notesVisible = !notesVisible;
        notesEl.classList.toggle("is-visible", notesVisible);
      }

      prevBtn.addEventListener("click", prev);
      nextBtn.addEventListener("click", next);

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
          e.preventDefault();
          next();
        } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault();
          prev();
        } else if (e.key === "n" || e.key === "N") {
          toggleNotes();
        } else if (e.key === "Home") {
          e.preventDefault();
          goTo(0);
        } else if (e.key === "End") {
          e.preventDefault();
          goTo(ACTIVE_SLIDES.length - 1);
        }
      });

      let touchStartX = 0;
      deck.addEventListener(
        "touchstart",
        (e) => {
          touchStartX = e.changedTouches[0].screenX;
        },
        { passive: true },
      );
      deck.addEventListener(
        "touchend",
        (e) => {
          const dx = e.changedTouches[0].screenX - touchStartX;
          if (Math.abs(dx) > 50) dx < 0 ? next() : prev();
        },
        { passive: true },
      );

      buildDeck();
      updateUI();
    </script>
  </body>
</html>
